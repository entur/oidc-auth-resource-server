buildscript {
    configurations.classpath {
        resolutionStrategy {
            // JReleaser needs JGit 5.13.x, Spotless pulls in 7.x: https://github.com/jreleaser/jreleaser/issues/1643
            // Latest 5.13.x, so CVE-2023-4759 is fixed.
            force 'org.eclipse.jgit:org.eclipse.jgit:7.8.0.202609011348-r'
        }
    }

    // Last-resort pins for the build classpath (plugins only, not the published libraries).
    dependencies {
        constraints {
            classpath('tools.jackson.core:jackson-databind:3.1.7') {
                because 'GHSA-wjgm-6hv5-3cvf, GHSA-q4xh-88c3-wmh7, GHSA-gx83-3vf8-gh7j, GHSA-wv8q-qhhj-9h54, GHSA-cxp5-3px4-pw24. Remove when spring-boot-gradle-plugin pulls in jackson-databind >= 3.1.7'
            }
            classpath('tools.jackson.core:jackson-core:3.1.7') {
                because 'GHSA-p6pp-m3f8-5c89, GHSA-7hhh-6rmp-j9qf. Remove when spring-boot-gradle-plugin pulls in jackson-core >= 3.1.7'
            }
            classpath('org.codehaus.plexus:plexus-utils:3.6.1') {
                because 'GHSA-6fmv-xxpf-w3cw. Remove when jreleaser-gradle-plugin pulls in plexus-utils >= 3.6.1'
            }
            classpath('org.apache.httpcomponents.client5:httpclient5:5.6.3') {
                because 'GHSA-hjcp-jmpx-g3qm. Remove when jreleaser-gradle-plugin and spring-boot-gradle-plugin pull in httpclient5 >= 5.6.3'
            }
            classpath('org.apache.httpcomponents.core5:httpcore5-h2:5.4.3') {
                because 'GHSA-v3jc-474w-2wm6. Remove when jreleaser-gradle-plugin and spring-boot-gradle-plugin pull in httpcore5-h2 >= 5.4.3'
            }
            classpath('com.fasterxml.jackson.core:jackson-databind:2.22.3') {
                because 'GHSA-5jmj-h7xm-6q6v, GHSA-5gvw-p9qm-jgwh, GHSA-vvgp-rfg2-7rr6, GHSA-wjgm-6hv5-3cvf, GHSA-q4xh-88c3-wmh7, GHSA-gx83-3vf8-gh7j, GHSA-wv8q-qhhj-9h54, GHSA-cxp5-3px4-pw24. Remove when jreleaser-gradle-plugin pulls in jackson-databind >= 2.22.3'
            }
            classpath('com.fasterxml.jackson.core:jackson-core:2.22.3') {
                because 'GHSA-p6pp-m3f8-5c89, GHSA-7hhh-6rmp-j9qf. Remove when jreleaser-gradle-plugin pulls in jackson-core >= 2.22.3'
            }
        }
    }
}

plugins {
    id 'base'
    id 'org.jreleaser' version "1.26.0"
    id 'com.github.ben-manes.versions' version '0.53.0' apply false
    id "com.github.spotbugs" version "6.4.5" apply false
    id 'com.diffplug.spotless' version "8.0.0" apply false
    id 'org.springframework.boot' version "4.0.8" apply false
}

subprojects {
    ext {
        javaJwtVersion = '4.6.1'
        jjwtVersion = '0.13.0'
        apacheCommonsVersion = '2.21.0'
        slf4jVersion = '2.0.17'

        junitPlatformVersion = '1.12.2'
        junitJupiterVersion  = '6.0.1'
        wiremockVersion = '3.13.2'

        lombokVersion = '1.18.42'
    }
}

jreleaser {
    signing {
        active = 'ALWAYS'
        armored = true
    }
    deploy {
        maven {
            mavenCentral {
                release {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                }
            }
            nexus2 {
                snapshot {
                    active = 'SNAPSHOT'
                    applyMavenCentralRules = true
                    snapshotSupported = true
                    closeRepository = true
                    releaseRepository = true
                    url = "https://ossrh-staging-api.central.sonatype.com/service/local"
                    snapshotUrl = 'https://central.sonatype.com/repository/maven-snapshots/'
                    stagingRepository('build/staging-deploy')
                }
            }
        }
    }
    release {
        github {
            enabled = true
        }
    }
}