import static org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES

plugins {
    id 'oidcAuth.java-conventions'
    id 'oidcAuth.library-conventions'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    api(platform(BOM_COORDINATES))

    // Spring
    api("org.springframework.boot:spring-boot-starter-oauth2-resource-server")
    api("org.springframework.boot:spring-boot-starter-web")

    // Other
    compileOnly("org.projectlombok:lombok:${lombokVersion}")
    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")

    // Testing
    testImplementation project(':oidc-rs-junit-tenant')
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.springframework.boot:spring-boot-starter-webmvc-test")
    testCompileOnly("org.projectlombok:lombok:${lombokVersion}")
    testAnnotationProcessor("org.projectlombok:lombok:${lombokVersion}")

    constraints {
        api('org.apache.tomcat.embed:tomcat-embed-core') {
            version { require '11.0.25' }
            because 'vulnerabilities'
        }
        // Jackson 3 comes in via the Spring Boot starters; the Spring Boot BOM manages 3.1.5.
        api('tools.jackson.core:jackson-databind') {
            version { require '3.1.7' }
            because 'Fixes GHSA-wjgm-6hv5-3cvf, GHSA-q4xh-88c3-wmh7, GHSA-gx83-3vf8-gh7j, GHSA-wv8q-qhhj-9h54 and GHSA-cxp5-3px4-pw24. Remove when the Spring Boot BOM manages >= 3.1.7'
        }
        api('tools.jackson.core:jackson-core') {
            version { require '3.1.7' }
            because 'Fixes GHSA-p6pp-m3f8-5c89 and GHSA-7hhh-6rmp-j9qf. Remove when the Spring Boot BOM manages >= 3.1.7'
        }
    }
}

spotbugs {
    excludeFilter = file("$projectDir/spotbugs-exclude.xml")
}
